server:
  port: 8181

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/workshop_booking_db}
    username: ${DB_USERNAME:workshop}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

workshop:
  time-zone: Asia/Phnom_Penh